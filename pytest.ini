[pytest]
testpaths = backend/tests
pythonpath = backend
addopts = -ra -W ignore::starlette.exceptions.StarletteDeprecationWarning
markers =
    slow: tests that are intentionally slower or rely on subprocess/thread timeout behavior or full local diagnostic/evaluation flows; exclude with -m "not slow" in short runner budgets and run explicitly for full sign-off.
    desktop_api_token_optional: opt-in bypass for desktop API token guard in TestClient tests (applied by default via collection hook except requires_desktop_api_token).
    requires_desktop_api_token: enforce desktop API token guard; excludes desktop_api_token_optional marker.
