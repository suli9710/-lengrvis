[pytest]
testpaths = backend/tests
pythonpath = backend
addopts = -ra -W ignore::starlette.exceptions.StarletteDeprecationWarning
markers =
    slow: tests that are intentionally slower or rely on subprocess/thread timeout behavior or full local diagnostic/evaluation flows; exclude with -m "not slow" in short runner budgets and run explicitly for full sign-off.
    desktop_api_token_optional: explicit opt-in to the test-only desktop API token bypass for browser-mode behavior.
    desktop_api_auth_contract: keep the desktop API token guard enabled without injecting the default TestClient credential.
