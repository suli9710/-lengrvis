name: Release Readiness

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
      - "rc-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate release readiness dashboard (non-strict)
        run: |
          python scripts/check_release_readiness_dashboard.py \
            --dashboard docs/release/release-readiness-dashboard.md

      - name: Validate market readiness dashboard (non-strict)
        run: |
          python scripts/check_market_readiness.py \
            --dashboard docs/business/market-readiness.md

      - name: Show delivery pipeline plan
        run: |
          python scripts/delivery_pipeline.py --plan-only

      - name: Strict release readiness
        # Strict mode fails while any P0 blocker is still open. This is expected
        # before RC, so PR/main runs report it without failing. Manual RC and
        # release tag runs are hard gates.
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          python scripts/check_release_readiness_dashboard.py \
            --dashboard docs/release/release-readiness-dashboard.md \
            --strict

      - name: Strict market readiness
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          python scripts/check_market_readiness.py \
            --dashboard docs/business/market-readiness.md \
            --strict
