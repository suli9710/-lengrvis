name: Release Readiness

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
      - "rc-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    env:
      LENGRVIS_RELEASE_OWNER_PUBLIC_KEY: ${{ vars.LENGRVIS_RELEASE_OWNER_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install signature verifier from existing dependency pins
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          lines = Path("backend/requirements-lock.txt").read_text().splitlines()
          pins = [next(line.split()[0] for line in lines if line.startswith(name + "=="))
                  for name in ("cryptography", "cffi", "pycparser")]
          subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", *pins], check=True)
          PY

      - name: Validate release readiness dashboard (non-strict)
        run: |
          python scripts/check_release_readiness_dashboard.py \
            --dashboard docs/release/release-readiness-dashboard.md

      - name: Validate full review scorecard
        run: npm run review:scorecard

      - name: Validate Agentic threat model
        run: npm run security:threat-model

      - name: Validate market readiness dashboard (non-strict)
        run: |
          python scripts/check_market_readiness.py \
            --dashboard docs/business/market-readiness.md

      - name: Show delivery pipeline plan
        run: |
          python scripts/delivery_pipeline.py --plan-only

      - name: Strict release readiness
        # Strict mode fails while any P0 blocker is still open. This is expected
        # before RC, so PR/main runs report it without failing. Manual RC and
        # release tag runs are hard RC gates and cannot accept P0 waivers.
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          python scripts/check_release_readiness_dashboard.py \
            --dashboard docs/release/release-readiness-dashboard.md \
            --rc-release

      - name: Strict market readiness
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          python scripts/check_market_readiness.py \
            --dashboard docs/business/market-readiness.md \
            --strict
