# Blocking cross-platform backend test (code-review checklist I-03).
# The Windows job in ci.yml remains the primary product gate; these Linux/macOS
# jobs prevent platform-guard regressions from landing. Dependencies install
# from the universal sha256-hashed development lock so the same resolved package set
# is exercised across all supported runners.
name: Backend cross-platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-linux:
    name: Backend pytest (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install backend dependencies (universal development hash lock)
        run: |
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Install Playwright Chromium (browser tool tests)
        run: python -m playwright install chromium
      - name: Backend test suite
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_CROSS_PLATFORM_CI: "1"
        run: python -m pytest backend/tests -q -m "not slow"
      - name: Backend slow lifecycle canaries
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_CROSS_PLATFORM_CI: "1"
        run: |
          python -m pytest -q \
            backend/tests/test_task_pool.py::test_pool_shutdown_drains_running_tasks \
            backend/tests/test_runs_api.py::test_cancelled_run_is_not_overwritten_by_finishing_engine_turn

  backend-macos:
    name: Backend pytest (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install backend dependencies (universal development hash lock)
        run: |
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Install Playwright Chromium (browser tool tests)
        run: python -m playwright install chromium
      - name: Backend test suite
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_CROSS_PLATFORM_CI: "1"
          # GitHub's ephemeral macOS login keychain can accept a write and then
          # immediately lose the item. Product keyring behavior has deterministic
          # mocked coverage; the full suite uses the sanctioned test fallback.
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: python -m pytest backend/tests -q -m "not slow"
      - name: Backend slow lifecycle canaries
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_CROSS_PLATFORM_CI: "1"
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          python -m pytest -q \
            backend/tests/test_task_pool.py::test_pool_shutdown_drains_running_tasks \
            backend/tests/test_runs_api.py::test_cancelled_run_is_not_overwritten_by_finishing_engine_turn
