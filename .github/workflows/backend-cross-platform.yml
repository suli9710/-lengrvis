# Blocking cross-platform backend test (code-review checklist I-03).
# The Windows job in ci.yml remains the primary product gate; these Linux/macOS
# jobs prevent platform-guard regressions from landing. Dependencies install
# from the universal sha256-hashed backend lock so the same resolved package set
# is exercised across all supported runners.
name: Backend cross-platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-linux:
    name: Backend pytest (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            requirements-dev.txt
      - name: Install backend dependencies (universal hash lock + dev)
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r backend/requirements-lock.txt
          python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium (browser tool tests)
        run: python -m playwright install chromium
      - name: Backend test suite
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ci-audit-hmac-secret
        run: python -m pytest backend/tests -q

  backend-macos:
    name: Backend pytest (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            requirements-dev.txt
      - name: Install backend dependencies (universal hash lock + dev)
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r backend/requirements-lock.txt
          python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium (browser tool tests)
        run: python -m playwright install chromium
      - name: Backend test suite
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ci-audit-hmac-secret
          # GitHub's ephemeral macOS login keychain can accept a write and then
          # immediately lose the item. Product keyring behavior has deterministic
          # mocked coverage; the full suite uses the sanctioned test fallback.
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: python -m pytest backend/tests -q
