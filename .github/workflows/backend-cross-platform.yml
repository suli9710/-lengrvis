# Cross-platform backend test (code-review checklist I-03).
# The blocking backend gate in ci.yml runs on windows-latest only; these
# Linux/macOS jobs add the missing cross-platform signal.
#
# They are INFORMATIONAL (continue-on-error) until a cross-platform dependency
# lock and platform-guarded imports are finalized: backend/requirements-lock.txt
# is resolved on win32 and pins Windows-only pywin32/comtypes (without markers)
# plus win32-resolved ML wheels, so it cannot install on Linux/macOS. These jobs
# therefore install from the marker-aware source requirements
# (backend/requirements.txt), which correctly skips the Windows-only deps. This
# mirrors the existing "informational until RC" continue-on-error pattern in
# release-readiness.yml.
name: Backend cross-platform (informational)

on:
  # Keep this informational matrix available for manual investigation, but do
  # not publish macOS/Ubuntu backend pytest checks on every push/PR until the
  # cross-platform dependency window is pinned and platform-only tests are
  # explicitly gated.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-linux:
    name: Backend pytest (ubuntu-latest)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Install backend dependencies (marker-aware source; skips Windows-only)
        run: |
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Install Playwright Chromium (browser tool tests)
        run: python -m playwright install chromium
      - name: Backend test suite
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ci-audit-hmac-secret
        run: python -m pytest backend/tests -q

  backend-macos:
    name: Backend pytest (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Install backend dependencies (marker-aware source; skips Windows-only)
        run: |
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Install Playwright Chromium (browser tool tests)
        run: python -m playwright install chromium
      - name: Backend test suite
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ci-audit-hmac-secret
        run: python -m pytest backend/tests -q
