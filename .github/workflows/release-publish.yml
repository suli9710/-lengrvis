name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true
        type: string
      release_owner_signature:
        description: "Detached Ed25519 signature over the exact reviewed candidate sign-off payload"
        required: true
        type: string
      manual_signoff_status:
        description: "Current-release evidence manual sign-off status"
        required: true
        default: "release_signoff_recorded"
        type: choice
        options:
          - rc_signoff_recorded
          - release_signoff_recorded
      candidate_run_id:
        description: "Immutable CI run ID that produced the reviewed candidate artifacts"
        required: true
        type: string
      candidate_run_attempt:
        description: "Immutable CI run attempt that produced the reviewed candidate artifacts"
        required: true
        type: string
      reviewed_evidence_run_id:
        description: "CI run ID containing the separately reviewed and sealed evidence artifact"
        required: true
        type: string
      reviewed_evidence_run_attempt:
        description: "Immutable run attempt containing the reviewed evidence artifact"
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: write

concurrency:
  group: release-publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build signed artifacts + publish release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 120
    environment: production
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
      LENGRVIS_RELEASE_EVIDENCE_HMAC_SECRET: ${{ secrets.LENGRVIS_RELEASE_EVIDENCE_HMAC_SECRET }}
      LENGRVIS_STRICT_STATE_MACHINE: "true"
      LENGRVIS_ALLOW_MOCK_FALLBACK: "false"
      LENGRVIS_RELEASE_CANDIDATE_REPOSITORY: ${{ github.repository }}
      LENGRVIS_RELEASE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      LENGRVIS_RELEASE_CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
      LENGRVIS_REVIEWED_EVIDENCE_RUN_ID: ${{ inputs.reviewed_evidence_run_id }}
      LENGRVIS_REVIEWED_EVIDENCE_RUN_ATTEMPT: ${{ inputs.reviewed_evidence_run_attempt }}
      LENGRVIS_ANDROID_APK_PATH: build/android/lengrvis-production.apk
      LENGRVIS_ANDROID_REAL_DEVICE_EVIDENCE_PATH: build/android-real-device-evidence-reviewed.json
      LENGRVIS_ANDROID_RELEASE_CERTIFICATE_SHA256: ${{ vars.LENGRVIS_ANDROID_RELEASE_CERTIFICATE_SHA256 }}
      LENGRVIS_ANDROID_BUILD_TOOLS_VERSION: ${{ vars.LENGRVIS_ANDROID_BUILD_TOOLS_VERSION }}
      LENGRVIS_ANDROID_APKSIGNER_SHA256: ${{ vars.LENGRVIS_ANDROID_APKSIGNER_SHA256 }}
      LENGRVIS_ANDROID_APKSIGNER_JAR_SHA256: ${{ vars.LENGRVIS_ANDROID_APKSIGNER_JAR_SHA256 }}
      LENGRVIS_ANDROID_AAPT_SHA256: ${{ vars.LENGRVIS_ANDROID_AAPT_SHA256 }}
      RELEASE_OWNER: ${{ github.actor }}
      RELEASE_OWNER_SIGNATURE: ${{ inputs.release_owner_signature }}
      LENGRVIS_RELEASE_OWNER_PUBLIC_KEY: ${{ vars.LENGRVIS_RELEASE_OWNER_PUBLIC_KEY }}
      RELEASE_EVIDENCE_MANUAL_SIGNOFF_STATUS: ${{ inputs.manual_signoff_status }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Validate immutable release candidate before checkout
        id: candidate_identity
        shell: pwsh
        run: |
          $releaseTag = [string]$env:RELEASE_TAG
          if ($releaseTag -notmatch '^v[0-9]+(?:\.[0-9]+){2}(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "release_tag must be a v-prefixed semantic version without whitespace or ref syntax."
          }

          $candidateRunId = [string]$env:LENGRVIS_RELEASE_CANDIDATE_RUN_ID
          $candidateRunAttempt = [string]$env:LENGRVIS_RELEASE_CANDIDATE_RUN_ATTEMPT
          if ($candidateRunId -notmatch '^[1-9][0-9]*$' -or $candidateRunAttempt -notmatch '^[1-9][0-9]*$') {
            throw "candidate_run_id and candidate_run_attempt must be positive integers."
          }
          $evidenceRunId = [string]$env:LENGRVIS_REVIEWED_EVIDENCE_RUN_ID
          $evidenceRunAttempt = [string]$env:LENGRVIS_REVIEWED_EVIDENCE_RUN_ATTEMPT
          if ($evidenceRunId -notmatch '^[1-9][0-9]*$' -or $evidenceRunAttempt -notmatch '^[1-9][0-9]*$') {
            throw "reviewed_evidence_run_id and reviewed_evidence_run_attempt must be positive integers."
          }

          $repositoryJson = gh api "repos/$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read the current repository through the GitHub Actions API." }
          $repository = $repositoryJson | ConvertFrom-Json
          if ([string]$repository.full_name -ne $env:GITHUB_REPOSITORY -or [string]::IsNullOrWhiteSpace([string]$repository.default_branch)) {
            throw "The GitHub API did not return the expected repository identity and default branch."
          }
          if ([string]$env:GITHUB_REF_NAME -ne [string]$repository.default_branch) {
            throw "Release publishing must be dispatched from the repository default branch."
          }

          $candidateWorkflowJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/release-candidate.yml"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read the release-candidate workflow through the GitHub Actions API." }
          $candidateWorkflow = $candidateWorkflowJson | ConvertFrom-Json
          if ([string]$candidateWorkflow.state -ne "active") {
            throw "The release-candidate workflow must be active before a publish run can use its artifacts."
          }

          $candidateRunJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$candidateRunId"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read the requested candidate run through the GitHub Actions API." }
          $candidateRun = $candidateRunJson | ConvertFrom-Json
          if ([string]$candidateRun.repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw "Candidate run repository does not match this repository."
          }
          if ([string]$candidateRun.workflow_id -ne [string]$candidateWorkflow.id) {
            throw "Candidate run was not produced by .github/workflows/release-candidate.yml."
          }
          if ([string]$candidateRun.run_attempt -ne $candidateRunAttempt) {
            throw "Candidate run attempt does not match the requested immutable run attempt."
          }
          if ([string]$candidateRun.status -ne "completed" -or [string]$candidateRun.conclusion -ne "success") {
            throw "Candidate run must be completed successfully before release publishing."
          }
          if ([string]$candidateRun.event -ne "workflow_dispatch") {
            throw "Candidate run must have been created by the release-candidate workflow_dispatch trigger."
          }
          if ([string]$candidateRun.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw "Candidate run head repository does not match this repository."
          }
          if ([string]$candidateRun.head_branch -ne [string]$repository.default_branch) {
            throw "Candidate run must originate from the repository default branch."
          }

          $commit = ([string]$candidateRun.head_sha).Trim().ToLowerInvariant()
          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw "Candidate run did not provide a full immutable Git commit SHA."
          }

          $evidenceWorkflowJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/release-reviewed-evidence.yml"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read the reviewed-evidence workflow through the GitHub Actions API." }
          $evidenceWorkflow = $evidenceWorkflowJson | ConvertFrom-Json
          if ([string]$evidenceWorkflow.state -ne "active") {
            throw "The reviewed-evidence workflow must be active before release publishing."
          }
          $evidenceRunJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$evidenceRunId"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read the reviewed-evidence run." }
          $evidenceRun = $evidenceRunJson | ConvertFrom-Json
          if ([string]$evidenceRun.repository.full_name -ne $env:GITHUB_REPOSITORY -or
              [string]$evidenceRun.workflow_id -ne [string]$evidenceWorkflow.id -or
              [string]$evidenceRun.run_attempt -ne $evidenceRunAttempt -or
              [string]$evidenceRun.status -ne "completed" -or
              [string]$evidenceRun.conclusion -ne "success" -or
              [string]$evidenceRun.event -ne "workflow_dispatch" -or
              [string]$evidenceRun.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
              [string]$evidenceRun.head_branch -ne [string]$repository.default_branch -or
              ([string]$evidenceRun.head_sha).Trim().ToLowerInvariant() -ne $commit) {
            throw "Reviewed-evidence run provenance must match the protected workflow and exact candidate commit."
          }
          $buildIdentifier = "rc-$candidateRunId-$candidateRunAttempt-$commit"
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "LENGRVIS_RELEASE_CANDIDATE_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LENGRVIS_RELEASE_BUILD_IDENTIFIER=$buildIdentifier" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GITHUB_SHA=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout verified release candidate commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.candidate_identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify supplied release tag is bound to verified candidate
        shell: pwsh
        run: |
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:RELEASE_TAG does not exist in the checked-out repository."
          }
          $tagCommit = (git rev-list -n 1 $tagRef).Trim().ToLowerInvariant()
          $checkoutCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($tagCommit -ne $env:LENGRVIS_RELEASE_CANDIDATE_COMMIT) {
            throw "Release tag $env:RELEASE_TAG does not resolve to the verified candidate commit."
          }
          if ($checkoutCommit -ne $env:LENGRVIS_RELEASE_CANDIDATE_COMMIT) {
            throw "Checked-out commit does not match the verified candidate commit."
          }

      - name: Download immutable candidate artifacts into isolated staging
        shell: pwsh
        run: |
          $destination = "build/promotion-input/candidate"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh run download "$env:LENGRVIS_RELEASE_CANDIDATE_RUN_ID" --name "release-candidate-artifacts" --dir $destination
          if ($LASTEXITCODE -ne 0) { throw "Unable to download immutable candidate artifacts." }

      - name: Verify immutable candidate checksums and provenance
        shell: pwsh
        run: |
          $candidateRoot = (Resolve-Path -LiteralPath "build/promotion-input/candidate").Path
          $manifestPath = Join-Path $candidateRoot "build/release-candidate-subjects.sha256"
          $provenanceBundle = Join-Path $candidateRoot "build/attestations/build-provenance.sigstore.json"
          $sbomBundle = Join-Path $candidateRoot "build/attestations/sbom.sigstore.json"
          $sbomPath = Join-Path $candidateRoot ".tmp/sbom/lengrvis-sbom.cdx.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Candidate artifact is missing its checksum manifest."
          }
          foreach ($bundle in @($provenanceBundle, $sbomBundle)) {
            if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
              throw "Candidate artifact is missing required attestation bundle: $bundle"
            }
            Get-Content -LiteralPath $bundle -Raw | ConvertFrom-Json | Out-Null
          }
          if (-not (Test-Path -LiteralPath $sbomPath -PathType Leaf)) {
            throw "Candidate artifact is missing the attested CycloneDX SBOM."
          }
          $sbomDocument = Get-Content -LiteralPath $sbomPath -Raw | ConvertFrom-Json
          if ($sbomDocument.bomFormat -ne "CycloneDX" -or -not $sbomDocument.components) {
            throw "Candidate artifact contains an invalid or empty CycloneDX SBOM."
          }

          $sbomBundleDocument = Get-Content -LiteralPath $sbomBundle -Raw | ConvertFrom-Json
          $payload = $sbomBundleDocument.dsseEnvelope.payload
          if ([string]::IsNullOrWhiteSpace($payload)) {
            throw "Candidate SBOM attestation bundle is missing its signed statement payload."
          }
          $statementJson = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload))
          $statement = $statementJson | ConvertFrom-Json
          if ($statement.predicateType -ne "https://cyclonedx.org/bom") {
            throw "Candidate SBOM attestation uses an unexpected predicate type."
          }
          $signedSbom = $statement.predicate | ConvertTo-Json -Depth 100 -Compress
          $downloadedSbom = $sbomDocument | ConvertTo-Json -Depth 100 -Compress
          if ($signedSbom -cne $downloadedSbom) {
            throw "Downloaded CycloneDX SBOM does not match the signed attestation predicate."
          }

          $lines = @(
            Get-Content -LiteralPath $manifestPath |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          $version = (Get-Content -LiteralPath desktop/package.json -Raw | ConvertFrom-Json).version
          $expectedSubjectPaths = @(
            ".tmp/sbom/lengrvis-sbom.cdx.json",
            "dist/backend.exe",
            "dist/backend-capabilities.json",
            "dist/Lengrvis-win-portable.zip",
            "dist/Lengrvis-$version-x64-self-extracting.exe",
            "desktop/release/Lengrvis-$version-x64.exe",
            "desktop/release/Lengrvis-$version-x64.exe.blockmap",
            "desktop/release/latest.yml"
          )
          if ($lines.Count -ne $expectedSubjectPaths.Count) {
            throw "Candidate checksum manifest must contain the exact immutable release subject set."
          }

          $candidatePrefix = "$candidateRoot$([IO.Path]::DirectorySeparatorChar)"
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($line in $lines) {
            if ($line -notmatch '^(?<digest>[0-9a-f]{64}) \*(?<path>.+)$') {
              throw "Candidate checksum manifest contains an invalid line."
            }
            $expectedDigest = $Matches.digest
            $relative = $Matches.path.Replace("\", "/")
            if (-not (
              $relative.StartsWith("dist/", [StringComparison]::OrdinalIgnoreCase) -or
              $relative.StartsWith("desktop/release/", [StringComparison]::OrdinalIgnoreCase) -or
              $relative.Equals(".tmp/sbom/lengrvis-sbom.cdx.json", [StringComparison]::Ordinal)
            )) {
              throw "Candidate checksum manifest contains a path outside the release artifact allowlist."
            }
            if (-not $seen.Add($relative)) {
              throw "Candidate checksum manifest contains a duplicate artifact path."
            }

            $artifactPath = [IO.Path]::GetFullPath((Join-Path $candidateRoot $relative))
            if (-not $artifactPath.StartsWith($candidatePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Candidate checksum manifest path escapes the immutable candidate root."
            }
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
              throw "Candidate checksum manifest references a missing artifact: $relative"
            }
            $actualDigest = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualDigest -ne $expectedDigest) {
              throw "Candidate artifact digest does not match the immutable manifest: $relative"
            }

            gh attestation verify "$artifactPath" `
              --bundle "$provenanceBundle" `
              --predicate-type "https://slsa.dev/provenance/v1" `
              --repo "$env:GITHUB_REPOSITORY" `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" `
              --source-digest "$env:LENGRVIS_RELEASE_CANDIDATE_COMMIT" `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub provenance verification failed for candidate artifact: $relative"
            }

            gh attestation verify "$artifactPath" `
              --bundle "$sbomBundle" `
              --predicate-type "https://cyclonedx.org/bom" `
              --repo "$env:GITHUB_REPOSITORY" `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" `
              --source-digest "$env:LENGRVIS_RELEASE_CANDIDATE_COMMIT" `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub SBOM attestation verification failed for candidate artifact: $relative"
            }
          }
          foreach ($expectedSubjectPath in $expectedSubjectPaths) {
            if (-not $seen.Contains($expectedSubjectPath)) {
              throw "Candidate checksum manifest is missing required release subject: $expectedSubjectPath"
            }
          }

      - name: Download reviewed release evidence into isolated staging
        shell: pwsh
        run: |
          $destination = "build/promotion-input/evidence"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh run download "$env:LENGRVIS_REVIEWED_EVIDENCE_RUN_ID" --name "release-reviewed-evidence" --dir $destination
          if ($LASTEXITCODE -ne 0) { throw "Unable to download reviewed release evidence." }

      - name: Materialize only allowed staged release inputs
        shell: pwsh
        run: |
          $candidateRoot = (Resolve-Path -LiteralPath "build/promotion-input/candidate").Path
          $evidenceRoot = (Resolve-Path -LiteralPath "build/promotion-input/evidence").Path
          foreach ($root in @($candidateRoot, $evidenceRoot)) {
            $links = @(Get-ChildItem -LiteralPath $root -Force -Recurse | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
            if ($links.Count -gt 0) { throw "Promotion artifacts must not contain symbolic links or reparse points." }
          }
          foreach ($pair in @(@("dist", "dist"), @("desktop/release", "desktop/release"))) {
            $source = Join-Path $candidateRoot $pair[0]
            if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "Candidate artifact is missing required directory: $($pair[0])" }
            New-Item -ItemType Directory -Force -Path $pair[1] | Out-Null
            $children = @(Get-ChildItem -LiteralPath $source -Force)
            if ($children.Count -eq 0) { throw "Candidate artifact directory is empty: $($pair[0])" }
            Get-ChildItem -LiteralPath $source -Force | Copy-Item -Destination $pair[1] -Recurse -Force
          }

          foreach ($relative in @(
            "build/delivery-candidate-verdict.json",
            ".tmp/sbom/lengrvis-sbom.cdx.json"
          )) {
            $source = Join-Path $candidateRoot $relative
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Candidate artifact is missing required file: $relative" }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $relative) | Out-Null
            Copy-Item -LiteralPath $source -Destination $relative -Force
          }

          # upload-artifact stores paths relative to their least common
          # ancestor (build/), so the downloaded evidence artifact is rooted
          # at the JSON files plus android/.  Map that archive layout back to
          # the strict delivery paths explicitly.
          $evidenceTargets = [ordered]@{
            "distribution-release-evidence-reviewed.json" = "build/distribution-release-evidence-reviewed.json"
            "clean-machine-release-evidence-reviewed.json" = "build/clean-machine-release-evidence-reviewed.json"
            "result-quality-review-evidence-reviewed.json" = "build/result-quality-review-evidence-reviewed.json"
            "diagnostics-external-review-evidence-reviewed.json" = "build/diagnostics-external-review-evidence-reviewed.json"
            "android-real-device-evidence-reviewed.json" = "build/android-real-device-evidence-reviewed.json"
            "android/lengrvis-production.apk" = "build/android/lengrvis-production.apk"
          }
          foreach ($entry in $evidenceTargets.GetEnumerator()) {
            $source = Join-Path $evidenceRoot $entry.Key
            $target = $entry.Value
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Reviewed evidence artifact is missing required file: $($entry.Key)" }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            Copy-Item -LiteralPath $source -Destination $target -Force
          }

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Verify checked-out candidate binding
        run: python scripts/verify_release_candidate_binding.py --require-checkout-match

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.11"

      - name: Create repository Python virtual environment
        run: |
          python -m venv .venv
          ".venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          npm --prefix desktop exec playwright install chromium

      - name: Verify release tag matches desktop version
        run: |
          $env:GITHUB_SHA = git rev-parse HEAD
          npm --prefix desktop run verify:release-version -- --require-tag

      - name: Validate full review scorecard
        run: npm run review:scorecard

      - name: Validate Agentic threat model
        run: npm run security:threat-model

      - name: Verify release safety profile
        run: npm run release:safety

      - name: Run release hygiene and dependency preflight
        id: hygiene
        run: npm run deps:verify

      - name: Run backend, desktop, and mobile quality preflight
        id: qa_gate
        run: npm run qa:gate

      - name: Run real-provider quality preflight
        id: real_llm_quality
        env:
          LENGRVIS_API_KEY: ${{ secrets.LENGRVIS_REAL_LLM_API_KEY }}
          LENGRVIS_PROVIDER_NAME: ${{ vars.LENGRVIS_REAL_LLM_PROVIDER_NAME || 'openai_compatible' }}
          LENGRVIS_BASE_URL: ${{ vars.LENGRVIS_REAL_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LENGRVIS_MODEL: ${{ vars.LENGRVIS_REAL_LLM_MODEL || 'gpt-4o-mini' }}
        run: python scripts/run_real_llm_eval.py --quality-gate

      - name: Run supply-chain preflight
        id: supply_chain
        run: npm run supply-chain:verify && npm run audit:deps && npm run security:secrets

      - name: Run extension security preflight
        id: extension_security
        run: npm run security:extensions

      - name: Verify downloaded candidate signatures
        env:
          AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: npm --prefix desktop run verify:windows-release-signatures

      - name: Strict release delivery verdict
        env:
          AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          RELEASE_EVIDENCE_NEEDS_JSON: >-
            {"hygiene":{"result":"${{ steps.hygiene.outcome }}"},"backend":{"result":"${{ steps.qa_gate.outcome }}"},"real-llm-quality":{"result":"${{ steps.real_llm_quality.outcome }}"},"desktop":{"result":"${{ steps.qa_gate.outcome }}"},"mobile":{"result":"${{ steps.qa_gate.outcome }}"},"supply-chain":{"result":"${{ steps.supply_chain.outcome }}"},"extension-security":{"result":"${{ steps.extension_security.outcome }}"}}
        run: npm run delivery:rc

      - name: Prepare verified GitHub Release assets and checksums
        run: |
          $version = (Get-Content -LiteralPath desktop/package.json -Raw | ConvertFrom-Json).version
          $candidateRoot = (Resolve-Path -LiteralPath "build/promotion-input/candidate").Path
          $candidatePrefix = "$candidateRoot$([IO.Path]::DirectorySeparatorChar)"
          $manifestPath = Join-Path $candidateRoot "build/release-candidate-subjects.sha256"
          $provenanceBundle = Join-Path $candidateRoot "build/attestations/build-provenance.sigstore.json"
          $sbomBundle = Join-Path $candidateRoot "build/attestations/sbom.sigstore.json"
          foreach ($required in @($manifestPath, $provenanceBundle, $sbomBundle)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Immutable candidate verification input is missing: $required"
            }
          }

          $expectedSubjectPaths = @(
            ".tmp/sbom/lengrvis-sbom.cdx.json",
            "dist/backend.exe",
            "dist/backend-capabilities.json",
            "dist/Lengrvis-win-portable.zip",
            "dist/Lengrvis-$version-x64-self-extracting.exe",
            "desktop/release/Lengrvis-$version-x64.exe",
            "desktop/release/Lengrvis-$version-x64.exe.blockmap",
            "desktop/release/latest.yml"
          )
          $manifestEntries = @{}
          foreach ($line in @(Get-Content -LiteralPath $manifestPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })) {
            if ($line -notmatch '^(?<digest>[0-9a-f]{64}) \*(?<path>.+)$') {
              throw "Candidate checksum manifest contains an invalid line during final verification."
            }
            $relative = $Matches.path.Replace("\", "/")
            if ($relative -notin $expectedSubjectPaths -or $manifestEntries.ContainsKey($relative)) {
              throw "Candidate checksum manifest does not match the exact final release subject set."
            }
            $manifestEntries[$relative] = $Matches.digest
          }
          if ($manifestEntries.Count -ne $expectedSubjectPaths.Count) {
            throw "Candidate checksum manifest must contain exactly the final 8 immutable subjects."
          }

          foreach ($relative in $expectedSubjectPaths) {
            if (-not $manifestEntries.ContainsKey($relative)) {
              throw "Candidate checksum manifest is missing final release subject: $relative"
            }
            $source = [IO.Path]::GetFullPath((Join-Path $candidateRoot $relative))
            if (-not $source.StartsWith($candidatePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Final release subject escapes immutable candidate staging: $relative"
            }
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Final release subject is missing from immutable candidate staging: $relative"
            }
            $actualDigest = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualDigest -ne $manifestEntries[$relative]) {
              throw "Final release subject changed after initial candidate verification: $relative"
            }

            gh attestation verify "$source" `
              --bundle "$provenanceBundle" `
              --predicate-type "https://slsa.dev/provenance/v1" `
              --repo "$env:GITHUB_REPOSITORY" `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" `
              --source-digest "$env:LENGRVIS_RELEASE_CANDIDATE_COMMIT" `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw "Final GitHub provenance verification failed for immutable candidate subject: $relative"
            }

            gh attestation verify "$source" `
              --bundle "$sbomBundle" `
              --predicate-type "https://cyclonedx.org/bom" `
              --repo "$env:GITHUB_REPOSITORY" `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" `
              --source-digest "$env:LENGRVIS_RELEASE_CANDIDATE_COMMIT" `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw "Final GitHub SBOM attestation verification failed for immutable candidate subject: $relative"
            }
          }

          $sbomRelativePath = ".tmp/sbom/lengrvis-sbom.cdx.json"
          $sbomSource = Join-Path $candidateRoot $sbomRelativePath
          $sbomDocument = Get-Content -LiteralPath $sbomSource -Raw | ConvertFrom-Json
          $sbomBundleDocument = Get-Content -LiteralPath $sbomBundle -Raw | ConvertFrom-Json
          $payload = $sbomBundleDocument.dsseEnvelope.payload
          if ([string]::IsNullOrWhiteSpace($payload)) {
            throw "Candidate SBOM attestation bundle is missing its signed statement payload."
          }
          $statementJson = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload))
          $statement = $statementJson | ConvertFrom-Json
          if ($statement.predicateType -ne "https://cyclonedx.org/bom") {
            throw "Candidate SBOM attestation uses an unexpected predicate type."
          }
          $signedSbom = $statement.predicate | ConvertTo-Json -Depth 100 -Compress
          $candidateSbom = $sbomDocument | ConvertTo-Json -Depth 100 -Compress
          if ($signedSbom -cne $candidateSbom) {
            throw "Immutable candidate SBOM does not match the signed attestation predicate."
          }

          $releaseAssetsDir = Join-Path (Resolve-Path -LiteralPath "build").Path "verified-release-assets"
          if (Test-Path -LiteralPath $releaseAssetsDir) {
            throw "Verified release asset staging already exists before final materialization."
          }
          New-Item -ItemType Directory -Path $releaseAssetsDir | Out-Null
          $releaseMappings = @(
            @{ Source = "dist/Lengrvis-win-portable.zip"; Target = "Lengrvis-$version-win-portable.zip" },
            @{ Source = "dist/Lengrvis-$version-x64-self-extracting.exe"; Target = "Lengrvis-$version-x64-self-extracting.exe" },
            @{ Source = "dist/backend.exe"; Target = "Lengrvis-$version-backend.exe" },
            @{ Source = "dist/backend-capabilities.json"; Target = "Lengrvis-$version-backend-capabilities.json" },
            @{ Source = "desktop/release/Lengrvis-$version-x64.exe"; Target = "Lengrvis-$version-x64.exe" },
            @{ Source = "desktop/release/Lengrvis-$version-x64.exe.blockmap"; Target = "Lengrvis-$version-x64.exe.blockmap" },
            @{ Source = "desktop/release/latest.yml"; Target = "latest.yml" },
            @{ Source = $sbomRelativePath; Target = "Lengrvis-$version-sbom.cdx.json" }
          )
          $uploadAssets = @()
          foreach ($mapping in $releaseMappings) {
            $source = Join-Path $candidateRoot $mapping.Source
            $target = Join-Path $releaseAssetsDir $mapping.Target
            Copy-Item -LiteralPath $source -Destination $target
            $copiedDigest = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($copiedDigest -ne $manifestEntries[$mapping.Source]) {
              throw "Final release staging copy changed immutable candidate bytes: $($mapping.Source)"
            }
            $uploadAssets += (Resolve-Path -LiteralPath $target).Path
          }
          $checksumLines = @($uploadAssets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $_)"
          })
          $checksumPath = Join-Path $releaseAssetsDir "lengrvis-$version-windows-sha256.txt"
          Set-Content -LiteralPath $checksumPath -Value $checksumLines -Encoding ASCII
          $uploadAssets += $checksumPath
          $uploadAssetNames = @($uploadAssets | ForEach-Object { Split-Path -Leaf $_ })
          if ($uploadAssets.Count -ne 9 -or @($uploadAssetNames | Sort-Object -Unique).Count -ne $uploadAssets.Count) {
            throw "Final GitHub Release asset set must contain exactly 9 uniquely named files."
          }
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Set-Content -LiteralPath build/release-upload-assets.txt -Value $uploadAssets -Encoding UTF8
          Set-Content -LiteralPath build/release-upload-asset-names.txt -Value $uploadAssetNames -Encoding UTF8

      - name: Create or update draft GitHub Release
        run: |
          $version = (Get-Content -LiteralPath desktop/package.json -Raw | ConvertFrom-Json).version
          $signingMode = "signed Windows installer plus portable assets"
          $notes = @"
          Lengrvis $version release.

          Publishing mode: $signingMode.

          Automated release commit: $env:LENGRVIS_RELEASE_CANDIDATE_COMMIT.
          "@
          $existingJson = gh release view "$env:RELEASE_TAG" --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not [bool]$existing.isDraft) {
              throw "Refusing to replace assets on an already-published release."
            }
            foreach ($asset in @($existing.assets)) {
              gh release delete-asset "$env:RELEASE_TAG" "$($asset.name)" --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to remove stale asset from the existing draft release: $($asset.name)"
              }
            }
            gh release edit "$env:RELEASE_TAG" --title "Lengrvis $version" --notes "$notes" --latest --target "$env:LENGRVIS_RELEASE_CANDIDATE_COMMIT"
            if ($LASTEXITCODE -ne 0) { throw "Unable to update the existing draft release." }
          } else {
            gh release create "$env:RELEASE_TAG" --title "Lengrvis $version" --notes "$notes" --draft --target "$env:LENGRVIS_RELEASE_CANDIDATE_COMMIT"
            if ($LASTEXITCODE -ne 0) { throw "Unable to create the draft release." }
          }

      - name: Upload the verified candidate bytes to GitHub Release
        run: |
          $uploadAssets = @(Get-Content -LiteralPath build/release-upload-assets.txt | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($uploadAssets.Count -ne 9) {
            throw "Expected the exact 9-file verified release asset set."
          }
          gh release upload "$env:RELEASE_TAG" @uploadAssets
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload the exact verified release asset set." }

      - name: Publish verified GitHub Release
        run: |
          $expectedAssets = @(
            Get-Content -LiteralPath build/release-upload-asset-names.txt |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Sort-Object -Unique
          )
          $releaseJson = gh release view "$env:RELEASE_TAG" --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect draft release before publication." }
          $release = $releaseJson | ConvertFrom-Json
          if (-not [bool]$release.isDraft) { throw "Release must remain a draft until its asset set is verified." }
          $actualAssets = @($release.assets | ForEach-Object { $_.name } | Sort-Object -Unique)
          $assetDifference = @(Compare-Object -ReferenceObject $expectedAssets -DifferenceObject $actualAssets)
          if ($expectedAssets.Count -ne 9 -or $actualAssets.Count -ne 9 -or $assetDifference.Count -gt 0) {
            throw "Draft release asset set does not exactly match the verified candidate asset set."
          }
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish the verified GitHub Release." }

      - name: Upload release diagnostics artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-diagnostics
          path: |
            build/delivery-verdict.json
            docs/release/current-release-evidence.md
            dist/backend.exe
            dist/backend-capabilities.json
            desktop/release/**
            .tmp/qa-evidence/**
            .tmp/release-evidence-packet/**
          include-hidden-files: true
          if-no-files-found: ignore
