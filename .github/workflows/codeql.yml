name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.languages }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - languages: python,javascript-typescript
            build-mode: none
            category: /language:python-typescript
            android-build: false
          - languages: java-kotlin
            build-mode: manual
            category: /language:java-kotlin
            android-build: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for the Android build
        if: ${{ matrix.android-build }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17 for the Android build
        if: ${{ matrix.android-build }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked mobile dependencies
        if: ${{ matrix.android-build }}
        run: npm --prefix mobile ci

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          languages: ${{ matrix.languages }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Compile Android Kotlin sources
        if: ${{ matrix.android-build }}
        working-directory: mobile/android
        run: bash ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          category: ${{ matrix.category }}
