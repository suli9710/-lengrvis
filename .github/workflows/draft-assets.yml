name: Prepare v0.1.3 development draft assets

on:
  push:
    branches: [codex/draft-assets-v0.1.3]

permissions:
  contents: read

concurrency:
  group: development-draft-assets-v0.1.3
  cancel-in-progress: false

env:
  SOURCE_SHA: 74a715f4608a64485214d776f430de93061a7a2b

jobs:
  build:
    if: github.repository == 'suli9710/-lengrvis' && github.ref == 'refs/heads/codex/draft-assets-v0.1.3'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
      manifest_digest: ${{ steps.stage.outputs.manifest_digest }}
    env:
      LENGRVIS_ALLOW_MOCK_FALLBACK: "false"
      LENGRVIS_STRICT_STATE_MACHINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 74a715f4608a64485214d776f430de93061a7a2b
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install isolated Python and locked build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA) { throw 'Wrong source checkout.' }
          if ((node --version).Trim() -cne 'v24.11.1') { throw 'Wrong Node runtime.' }
          New-Item -ItemType Directory -Path 'draft-logs' | Out-Null
          python -m pip install uv==0.11.20
          if ($LASTEXITCODE -ne 0) { throw 'uv bootstrap failed.' }
          uv python install 3.12.13
          if ($LASTEXITCODE -ne 0) { throw 'Python download failed.' }
          uv venv --python 3.12.13 .venv --seed
          if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed.' }
          $pythonDir = Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts'
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$pythonDir/python.exe" -m pip install --require-hashes -r requirements-dev-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked development dependencies failed.' }
          & "$pythonDir/python.exe" -m pip install --require-hashes -r backend/requirements-build-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked build dependencies failed.' }
          npm ci --ignore-scripts --engine-strict
          if ($LASTEXITCODE -ne 0) { throw 'Locked root dependencies failed.' }
      - name: Build unsigned development assets and verify executable packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/build_all.ps1 -SkipTests 2>&1 | Tee-Object draft-logs/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Development artifact build failed.' }
          pwsh -NoProfile -File scripts/verify_packaging.ps1 -RunExecutableSmoke -SmokeTimeoutSeconds 45 2>&1 | Tee-Object draft-logs/packaging.log
          if ($LASTEXITCODE -ne 0) { throw 'Executable packaging verification failed.' }
      - name: Stage exact six assets and bind their digests to source and run
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA) { throw 'Source identity changed.' }
          if ((Get-Content desktop/package.json -Raw | ConvertFrom-Json).version -cne '0.1.3') { throw 'Wrong version.' }
          $assetDir = 'draft-bundle/assets'
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          $mappings = [ordered]@{
            'Lengrvis-0.1.3-backend.exe' = 'dist/backend.exe'
            'Lengrvis-0.1.3-backend-capabilities.json' = 'dist/backend-capabilities.json'
            'Lengrvis-0.1.3-backend-sqlite-runtime.json' = 'dist/backend-sqlite-runtime.json'
            'Lengrvis-0.1.3-win-portable.zip' = 'dist/Lengrvis-win-portable.zip'
            'Lengrvis-0.1.3-x64-self-extracting.exe' = 'dist/Lengrvis-0.1.3-x64-self-extracting.exe'
          }
          $checksums = foreach ($name in $mappings.Keys) {
            Copy-Item -LiteralPath $mappings[$name] -Destination (Join-Path $assetDir $name)
            $digest = (Get-FileHash -LiteralPath (Join-Path $assetDir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $name"
          }
          $checksums | Set-Content -LiteralPath "$assetDir/lengrvis-0.1.3-windows-sha256.txt" -Encoding ascii
          $assets = @(Get-ChildItem -LiteralPath $assetDir -File | Sort-Object Name | ForEach-Object {
            [ordered]@{ name = $_.Name; size = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          if ($assets.Count -ne 6) { throw 'Expected exactly six development assets.' }
          $sqlite = Get-Content "$assetDir/Lengrvis-0.1.3-backend-sqlite-runtime.json" -Raw | ConvertFrom-Json
          $backend = $assets | Where-Object { $_.name -ceq 'Lengrvis-0.1.3-backend.exe' }
          if ($sqlite.artifact_sha256 -cne $backend.sha256) { throw 'SQLite evidence does not bind backend bytes.' }
          [ordered]@{
            schema = 'lengrvis-development-draft/v1'; source_sha = $env:SOURCE_SHA
            repository = $env:GITHUB_REPOSITORY; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            version = '0.1.3'; release_signoff = $false; assets = $assets
          } | ConvertTo-Json -Depth 6 | Set-Content draft-bundle/manifest.json -Encoding utf8
          $manifestDigest = (Get-FileHash draft-bundle/manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "manifest_digest=$manifestDigest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload immutable development bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-draft-v0.1.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: draft-bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain build and packaging logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-draft-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            draft-logs/
            dist/sqlite-runtime-evidence/
            .tmp/packaging-smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  update-draft:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      # No source checkout or dependency installation in this write-capable job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/development-draft
          merge-multiple: true
      - name: Verify bundle and replace only owned assets on the existing draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          MANIFEST_DIGEST: ${{ needs.build.outputs.manifest_digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'suli9710/-lengrvis'
          $releaseId = 430510109
          $tag = 'v0.1.3'
          if ($env:GITHUB_REPOSITORY -cne $repo -or $env:GITHUB_REF -cne 'refs/heads/codex/draft-assets-v0.1.3') { throw 'Wrong workflow context.' }
          function Read-Api([string]$Endpoint) {
            $json = gh api $Endpoint
            if ($LASTEXITCODE -ne 0) { throw "GitHub read failed: $Endpoint" }
            return ($json | ConvertFrom-Json)
          }
          $metadata = Read-Api "repos/$repo/actions/artifacts/$env:ARTIFACT_ID"
          $artifactName = "development-draft-v0.1.3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($metadata.expired -or [string]$metadata.workflow_run.id -cne $env:GITHUB_RUN_ID -or
              $metadata.name -cne $artifactName -or $metadata.digest -cne "sha256:$env:ARTIFACT_DIGEST") { throw 'Artifact provenance mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP 'development-draft'
          $manifestPath = Join-Path $root 'manifest.json'
          if ((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:MANIFEST_DIGEST) { throw 'Manifest digest mismatch.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema -cne 'lengrvis-development-draft/v1' -or $manifest.source_sha -cne $env:SOURCE_SHA -or
              $manifest.repository -cne $repo -or $manifest.version -cne '0.1.3' -or $manifest.release_signoff -ne $false -or
              $manifest.run_id -cne $env:GITHUB_RUN_ID -or $manifest.run_attempt -cne $env:GITHUB_RUN_ATTEMPT) { throw 'Manifest identity mismatch.' }
          $names = @('Lengrvis-0.1.3-backend.exe', 'Lengrvis-0.1.3-backend-capabilities.json',
            'Lengrvis-0.1.3-backend-sqlite-runtime.json', 'Lengrvis-0.1.3-win-portable.zip',
            'Lengrvis-0.1.3-x64-self-extracting.exe', 'lengrvis-0.1.3-windows-sha256.txt')
          $assetDir = Join-Path $root 'assets'
          $files = @(Get-ChildItem -LiteralPath $root -File -Recurse)
          if ($files.Count -ne 7 -or @($manifest.assets).Count -ne 6 -or
              @($manifest.assets.name | Sort-Object -Unique -CaseSensitive).Count -ne 6) { throw 'Unexpected artifact file set.' }
          $expected = @{}
          foreach ($name in $names) {
            $entry = @($manifest.assets | Where-Object { $_.name -ceq $name })
            $path = Join-Path $assetDir $name
            if ($entry.Count -ne 1 -or $entry[0].sha256 -cnotmatch '^[0-9a-f]{64}$' -or $entry[0].size -le 0) { throw "Invalid entry: $name" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry[0].sha256 -or
                (Get-Item -LiteralPath $path).Length -ne $entry[0].size) { throw "Asset bytes mismatch: $name" }
            $expected[$name] = $entry[0]
          }
          function Read-CheckedDraft {
            $release = Read-Api "repos/$repo/releases/$releaseId"
            if ($release.id -ne $releaseId -or $release.draft -ne $true -or $release.prerelease -ne $true -or
                $release.tag_name -cne $tag -or $release.target_commitish -cne $env:SOURCE_SHA) { throw 'Release identity or draft state changed; refusing mutation.' }
            $remoteNames = @($release.assets | ForEach-Object { $_.name })
            if (@($remoteNames | Sort-Object -Unique -CaseSensitive).Count -ne $remoteNames.Count) { throw 'Duplicate remote asset names.' }
            foreach ($asset in @($release.assets)) {
              if ($names -cnotcontains $asset.name) { throw "Unexpected remote asset: $($asset.name)" }
            }
            return $release
          }
          foreach ($name in $names) {
            $draft = Read-CheckedDraft
            $existing = @($draft.assets | Where-Object { $_.name -ceq $name })
            if ($existing.Count -eq 1) {
              $null = Read-CheckedDraft
              gh api --method DELETE "repos/$repo/releases/assets/$($existing[0].id)"
              if ($LASTEXITCODE -ne 0) { throw "Draft asset removal failed: $name" }
            }
            $null = Read-CheckedDraft
            gh release upload $tag (Join-Path $assetDir $name) --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "Draft asset upload failed: $name" }
            $draft = Read-CheckedDraft
            $uploaded = @($draft.assets | Where-Object { $_.name -ceq $name })
            if ($uploaded.Count -ne 1 -or $uploaded[0].state -cne 'uploaded' -or
                $uploaded[0].digest -cne "sha256:$($expected[$name].sha256)" -or $uploaded[0].size -ne $expected[$name].size) { throw "Remote digest/size mismatch: $name" }
          }
          $final = Read-CheckedDraft
          if (@($final.assets).Count -ne 6) { throw 'Final draft asset count mismatch.' }
          foreach ($asset in @($final.assets)) {
            if ($asset.state -cne 'uploaded' -or $asset.digest -cne "sha256:$($expected[$asset.name].sha256)" -or
                $asset.size -ne $expected[$asset.name].size) { throw 'Final draft bytes mismatch.' }
          }
          'Six development assets verified. Release remains a draft; no tag, notes, publication, or sign-off changed.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
