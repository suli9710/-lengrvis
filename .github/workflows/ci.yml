# Main CI gate (market-readiness checklist #2 golden tasks, #41 release:check-in-CI).
# Scope: machine-verifiable dev evidence only. This gate does NOT replace
# clean-machine RC sign-off, real-device evidence, or human result-quality review.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene + dependency locks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Repo hygiene check
        run: npm run hygiene
      - name: Dependency lock verification
        run: npm run deps:verify
      - name: Maintainability source-size gate
        run: npm run maintainability:gate
      - name: Full review scorecard gate
        run: npm run review:scorecard
      - name: Agentic threat model gate
        run: npm run security:threat-model

  backend:
    name: Backend pytest + golden task gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install locked backend and development dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Backend dependency audit gate
        run: python -m pip_audit -r backend/requirements-lock.txt --disable-pip --no-deps
      - name: Install Playwright Chromium (browser tool tests)
        run: python -m playwright install chromium
      - name: Backend test suite
        # Explicit audit HMAC secret as defense-in-depth (R4-C1): the first
        # audit write must never depend on secret-file bootstrap in CI.
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
        run: python -m pytest backend/tests -q --maxfail=1 --cov=backend/app --cov-report=term-missing:skip-covered --cov-fail-under=75
      - name: Golden task gate (>=95% pass rate report)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/run_golden_tasks.ps1
      - name: Upload golden task report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-tasks-report
          path: .tmp/qa-evidence/golden-tasks/
          include-hidden-files: true
          if-no-files-found: ignore

  real-llm-quality:
    name: Real LLM quality gate
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      release_evidence_status: ${{ steps.real-llm-skip.outputs.release_evidence_status || steps.real-llm-eval.outputs.release_evidence_status }}
    env:
      LENGRVIS_API_KEY: ${{ secrets.LENGRVIS_REAL_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Skip real LLM quality gate when secret is unavailable
        id: real-llm-skip
        if: ${{ env.LENGRVIS_API_KEY == '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/qa-evidence/real-llm-eval | Out-Null
          @{
            ok = $false
            skipped = $true
            blocking_for_release = $true
            reason = "LENGRVIS_REAL_LLM_API_KEY secret is not configured for this workflow context."
          } | ConvertTo-Json | Set-Content .tmp/qa-evidence/real-llm-eval/real-llm-eval-report.json -Encoding UTF8
          "release_evidence_status=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Warning "Real LLM quality gate skipped because LENGRVIS_REAL_LLM_API_KEY is not configured. Release evidence remains incomplete."
      - name: Real LLM eval quality gate
        id: real-llm-eval
        if: ${{ env.LENGRVIS_API_KEY != '' }}
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_PROVIDER_NAME: ${{ vars.LENGRVIS_REAL_LLM_PROVIDER_NAME || 'openai_compatible' }}
          LENGRVIS_BASE_URL: ${{ vars.LENGRVIS_REAL_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LENGRVIS_MODEL: ${{ vars.LENGRVIS_REAL_LLM_MODEL || 'gpt-4o-mini' }}
          LENGRVIS_ALLOW_MOCK_FALLBACK: "false"
          LENGRVIS_MODE: efficiency
        run: |
          python scripts/run_real_llm_eval.py --quality-gate
          "release_evidence_status=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload real LLM eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-llm-eval-report
          path: .tmp/qa-evidence/real-llm-eval/
          include-hidden-files: true
          if-no-files-found: ignore

  desktop:
    name: Desktop typecheck + audit + behavior smokes
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Desktop dependency audit gate (high+ blocks the PR)
        run: npm --prefix desktop audit --audit-level=high
      - name: Desktop typecheck
        run: npm --prefix desktop run typecheck
      - name: Desktop unit tests (Vitest)
        run: npm --prefix desktop test
      - name: Install Playwright Chromium (UI smokes)
        run: npm --prefix desktop exec playwright install chromium
      - name: Desktop behavior smokes
        run: npm --prefix desktop run smoke

  mobile:
    name: Mobile typecheck + behavior smokes
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm --prefix mobile ci
      - name: Mobile Expo dependency compatibility gate
        run: |
          cd mobile
          npm exec expo -- install --check
      - name: Mobile dependency audit gate (high+ blocks the PR)
        run: npm --prefix mobile audit --audit-level=high
      - name: Mobile typecheck
        run: npm --prefix mobile run typecheck
      - name: Mobile token smoke
        run: npm --prefix mobile run smoke:token
      - name: Mobile consent contract smoke
        run: npm --prefix mobile run smoke:consent
      - name: Mobile session lifecycle smoke
        run: npm --prefix mobile run smoke:session-lifecycle
      - name: Mobile push notification smoke
        run: npm --prefix mobile run smoke:push-notifications
      - name: Mobile push subscription lifecycle smoke
        run: npm --prefix mobile run smoke:push-subscription-lifecycle
      - name: Mobile task companion smoke
        run: npm --prefix mobile run smoke:task-companion
      - name: Mobile remote input grant smoke
        run: npm --prefix mobile run smoke:remote-input-grant
      - name: Mobile wakeup contract smoke
        run: npm --prefix mobile run smoke:wakeup-contract
      - name: Mobile Android back navigation smoke
        run: npm --prefix mobile run smoke:android-back
      - name: Mobile approval status label smoke
        run: npm --prefix mobile run smoke:approval-status-label
      - name: Mobile Android hardening plugin smoke
        run: npm --prefix mobile run smoke:android-hardening-plugin
      - name: Mobile Android prebuild network-security smoke
        run: npm --prefix mobile run smoke:android-prebuild-network-security
      - name: Mobile Android manifest/resources hardening smoke
        run: npm --prefix mobile run smoke:android-manifest-resources
      - name: Mobile Android LAN TLS source + connected test contract
        run: npm --prefix mobile run smoke:android-lan-tls
      - name: Android native debug + androidTest compilation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:JAVA_HOME_17_X64) {
            $env:JAVA_HOME = $env:JAVA_HOME_17_X64
            $env:Path = "$env:JAVA_HOME\\bin;$env:Path"
          }
          if (-not $env:ANDROID_HOME -or -not (Test-Path -LiteralPath $env:ANDROID_HOME)) {
            throw "ANDROID_HOME is required to compile the Android companion."
          }
          $debugKeystore = Join-Path $env:USERPROFILE ".android\\debug.keystore"
          if (-not (Test-Path -LiteralPath $debugKeystore)) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $debugKeystore) | Out-Null
            & keytool -genkeypair -v `
              -storetype JKS `
              -keystore $debugKeystore `
              -storepass android `
              -keypass android `
              -alias androiddebugkey `
              -keyalg RSA `
              -keysize 2048 `
              -validity 10000 `
              -dname "CN=Android Debug,O=Android,C=US"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Push-Location mobile/android
          try {
            & .\\gradlew.bat :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

  supply-chain:
    name: Supply chain lock + SBOM
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Dependency lock verification
        run: npm run deps:verify
      - name: Generate CycloneDX SBOM
        run: npm run sbom:generate
      - name: Upload current SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-sbom
          path: .tmp/sbom/lengrvis-sbom.cdx.json
          include-hidden-files: true
          if-no-files-found: error

  extension-security:
    name: IPC + Skill/MCP + settings security gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: IPC + Skill/MCP + settings security gate
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
        run: npm run security:extensions
      - name: Upload extension security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-security-gate
          path: .tmp/extension-security-gate/
          include-hidden-files: true
          if-no-files-found: ignore

  release-evidence:
    name: Current release evidence
    runs-on: windows-latest
    needs: [hygiene, backend, real-llm-quality, desktop, mobile, supply-chain, extension-security]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate current release evidence
        env:
          RELEASE_EVIDENCE_NEEDS_JSON: ${{ toJson(needs) }}
          RELEASE_OWNER: ${{ github.actor }}
        run: npm run evidence:current-release
      - name: Upload current release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-release-evidence
          path: docs/release/current-release-evidence.md
          if-no-files-found: error
