# Main CI gate (market-readiness checklist #2 golden tasks, #41 release:check-in-CI).
# Scope: machine-verifiable dev evidence only. This gate does NOT replace
# clean-machine RC sign-off, real-device evidence, or human result-quality review.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene + dependency locks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Repo hygiene check
        run: npm run hygiene
      - name: Dependency lock verification
        run: npm run deps:verify

  backend:
    name: Backend pytest + golden task gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            requirements-dev.txt
      - name: Install backend dependencies (direct lock + dev)
        run: |
          python -m pip install -U pip
          python -m pip install -r backend/requirements-lock.txt -r requirements-dev.txt
      - name: Install Playwright Chromium (browser tool tests)
        run: python -m playwright install chromium
      - name: Backend test suite
        # Explicit audit HMAC secret as defense-in-depth (R4-C1): the first
        # audit write must never depend on secret-file bootstrap in CI.
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ci-audit-hmac-secret
        run: python -m pytest backend/tests -q --maxfail=1
      - name: Golden task gate (>=95% pass rate report)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/run_golden_tasks.ps1
      - name: Upload golden task report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-tasks-report
          path: .tmp/qa-evidence/golden-tasks/
          if-no-files-found: ignore

  desktop:
    name: Desktop typecheck + audit + behavior smokes
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Desktop dependency audit gate (high+ blocks the PR)
        run: npm --prefix desktop audit --audit-level=high
      - name: Desktop typecheck
        run: npm --prefix desktop run typecheck
      - name: Desktop unit tests (Vitest)
        run: npm --prefix desktop test
      - name: Install Playwright Chromium (UI smokes)
        run: npm --prefix desktop exec playwright install chromium
      - name: Desktop behavior smokes
        run: npm --prefix desktop run smoke

  mobile:
    name: Mobile typecheck + behavior smokes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm --prefix mobile ci
      - name: Mobile dependency audit gate (high+ blocks the PR)
        run: npm --prefix mobile audit --audit-level=high
      - name: Mobile typecheck
        run: npm --prefix mobile run typecheck
      - name: Mobile token smoke
        run: npm --prefix mobile run smoke:token
      - name: Mobile task companion smoke
        run: npm --prefix mobile run smoke:task-companion
      - name: Mobile remote input grant smoke
        run: npm --prefix mobile run smoke:remote-input-grant
      - name: Mobile wakeup contract smoke
        run: npm --prefix mobile run smoke:wakeup-contract
      - name: Mobile Android back navigation smoke
        run: npm --prefix mobile run smoke:android-back
