name: Release Candidate Gate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  rc-gate:
    name: Build and verify immutable candidate artifacts
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release-candidate
    env:
      LENGRVIS_STRICT_STATE_MACHINE: "true"
      LENGRVIS_ALLOW_MOCK_FALLBACK: "false"
      LENGRVIS_RELEASE_CANDIDATE_COMMIT: ${{ github.sha }}
      LENGRVIS_RELEASE_BUILD_IDENTIFIER: rc-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      LENGRVIS_RELEASE_CANDIDATE_REPOSITORY: ${{ github.repository }}
      LENGRVIS_RELEASE_CANDIDATE_RUN_ID: ${{ github.run_id }}
      LENGRVIS_RELEASE_CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Verify checked-out candidate binding
        run: python scripts/verify_release_candidate_binding.py --require-checkout-match

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.11"

      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          npm --prefix desktop exec playwright install chromium

      - name: Validate full review scorecard
        run: npm run review:scorecard

      - name: Validate Agentic threat model
        run: npm run security:threat-model

      - name: Run release hygiene and dependency preflight
        id: hygiene
        run: npm run deps:verify

      - name: Run backend, desktop, and mobile quality preflight
        id: qa_gate
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
        run: npm run qa:gate

      - name: Run real-provider quality preflight
        id: real_llm_quality
        env:
          LENGRVIS_API_KEY: ${{ secrets.LENGRVIS_REAL_LLM_API_KEY }}
          LENGRVIS_PROVIDER_NAME: ${{ vars.LENGRVIS_REAL_LLM_PROVIDER_NAME || 'openai_compatible' }}
          LENGRVIS_BASE_URL: ${{ vars.LENGRVIS_REAL_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LENGRVIS_MODEL: ${{ vars.LENGRVIS_REAL_LLM_MODEL || 'gpt-4o-mini' }}
          LENGRVIS_ALLOW_MOCK_FALLBACK: "false"
        run: python scripts/run_real_llm_eval.py --quality-gate

      - name: Run supply-chain preflight
        id: supply_chain
        run: npm run supply-chain:verify && npm run audit:deps && npm run security:secrets

      - name: Run extension security preflight
        id: extension_security
        run: npm run security:extensions

      - name: Build release artifacts
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_RELEASE_EVIDENCE_HMAC_SECRET: ${{ secrets.LENGRVIS_RELEASE_EVIDENCE_HMAC_SECRET }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build_all.ps1 -SkipTests

      - name: Verify signed Windows release configuration
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: npm --prefix desktop run verify:signed-build-config

      - name: Sign backend executable
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161: ${{ vars.AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161 }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/sign_windows_backend.ps1 -AllowModuleInstall

      - name: Sign portable launcher
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161: ${{ vars.AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161 }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/sign_windows_portable_artifacts.ps1 -LauncherOnly

      - name: Refresh portable release bundle
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/refresh_portable_release_bundle.ps1

      - name: Sign self-extracting portable executable
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161: ${{ vars.AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161 }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/sign_windows_portable_artifacts.ps1 -SelfExtractingOnly

      - name: Build signed Windows installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: npm --prefix desktop run dist:signed

      - name: Automated candidate delivery verdict
        # A failed prerequisite stops the job. These are step outcomes from
        # this candidate run, never a synthetic all-success declaration.
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_API_KEY: ${{ secrets.LENGRVIS_REAL_LLM_API_KEY }}
          LENGRVIS_PROVIDER_NAME: ${{ vars.LENGRVIS_REAL_LLM_PROVIDER_NAME || 'openai_compatible' }}
          LENGRVIS_BASE_URL: ${{ vars.LENGRVIS_REAL_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LENGRVIS_MODEL: ${{ vars.LENGRVIS_REAL_LLM_MODEL || 'gpt-4o-mini' }}
          LENGRVIS_MODE: efficiency
          AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: npm run delivery:candidate

      - name: Prepare release candidate attestation subjects
        shell: pwsh
        run: |
          $sbomPath = ".tmp/sbom/lengrvis-sbom.cdx.json"
          if (-not (Test-Path -LiteralPath $sbomPath -PathType Leaf)) {
            throw "The successful supply-chain gate did not produce the release candidate SBOM."
          }
          $sbom = Get-Content -LiteralPath $sbomPath -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne "CycloneDX" -or -not $sbom.components) {
            throw "The release candidate SBOM is not a populated CycloneDX document."
          }

          $subjects = @()
          foreach ($relative in @(
            "dist/backend.exe",
            "dist/backend-capabilities.json",
            "dist/Lengrvis-win-portable.zip"
          )) {
            if (-not (Test-Path -LiteralPath $relative -PathType Leaf)) {
              throw "Missing required attestation subject: $relative"
            }
            $subjects += Get-Item -LiteralPath $relative
          }

          $selfExtracting = @(
            Get-ChildItem -Path "dist/Lengrvis-*-x64-self-extracting.exe" -File -ErrorAction SilentlyContinue
          )
          if ($selfExtracting.Count -eq 0) {
            throw "No self-extracting portable executable was available for attestation."
          }
          $subjects += $selfExtracting

          $installers = @(
            Get-ChildItem -Path "desktop/release/*.exe" -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path "desktop/release/*.msi" -File -ErrorAction SilentlyContinue
          )
          if ($installers.Count -eq 0) {
            throw "No signed Windows installer was available for attestation."
          }
          $subjects += $installers
          $subjects += @(
            Get-ChildItem -Path "desktop/release/*.blockmap" -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path "desktop/release/*.yml" -File -ErrorAction SilentlyContinue
          )

          $repositoryRoot = (Resolve-Path -LiteralPath ".").Path
          $checksumLines = @(
            $subjects |
              Sort-Object FullName -Unique |
              ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($repositoryRoot, $_.FullName).Replace("\", "/")
                $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                "$digest *$relative"
              }
          )
          if ($checksumLines.Count -lt 5) {
            throw "Release candidate attestation subject set is unexpectedly incomplete."
          }
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Set-Content -LiteralPath build/release-candidate-subjects.sha256 -Value $checksumLines -Encoding ASCII

      - name: Attest release candidate build provenance
        id: attest_provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: build/release-candidate-subjects.sha256

      - name: Attest release candidate SBOM
        id: attest_sbom
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: build/release-candidate-subjects.sha256
          sbom-path: .tmp/sbom/lengrvis-sbom.cdx.json

      - name: Preserve release candidate attestation bundles
        shell: pwsh
        run: |
          $bundles = [ordered]@{
            "build-provenance.sigstore.json" = '${{ steps.attest_provenance.outputs.bundle-path }}'
            "sbom.sigstore.json" = '${{ steps.attest_sbom.outputs.bundle-path }}'
          }
          New-Item -ItemType Directory -Path build/attestations -Force | Out-Null
          foreach ($entry in $bundles.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value) -or -not (Test-Path -LiteralPath $entry.Value -PathType Leaf)) {
              throw "GitHub did not return the expected $($entry.Key) attestation bundle."
            }
            Copy-Item -LiteralPath $entry.Value -Destination (Join-Path build/attestations $entry.Key) -Force
          }

      - name: Upload release candidate artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-artifacts
          path: |
            build/delivery-candidate-verdict.json
            build/release-candidate-subjects.sha256
            build/attestations/**
            dist/backend.exe
            dist/backend-capabilities.json
            dist/Lengrvis-win-portable/**
            dist/Lengrvis-win-portable.zip
            dist/Lengrvis-*-x64-self-extracting.exe
            desktop/release/**
            .tmp/sbom/lengrvis-sbom.cdx.json
            .tmp/qa-evidence/**
            .tmp/release-evidence-packet/**
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload blocked release candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocked-release-candidate-diagnostics
          path: |
            build/delivery-verdict.json
            build/delivery-candidate-verdict.json
            build/release-candidate-subjects.sha256
            build/attestations/**
            docs/release/current-release-evidence.md
            .tmp/sbom/lengrvis-sbom.cdx.json
            .tmp/qa-evidence/**
            .tmp/release-evidence-packet/**
            .tmp/packaging-smoke/**
          include-hidden-files: true
          if-no-files-found: ignore
