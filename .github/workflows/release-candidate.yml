name: Release Candidate Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-gate:
    name: Build artifacts + strict release gate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r backend/requirements-lock.txt -r requirements-dev.txt
          python -m pip install pip-audit

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          npm --prefix desktop exec playwright install chromium

      - name: Build release artifacts
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ci-audit-hmac-secret
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build_all.ps1 -SkipTests

      - name: Strict release artifact gate
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ci-audit-hmac-secret
        run: npm run release:check

      - name: Strict delivery verdict
        if: always()
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ci-audit-hmac-secret
        run: npm run delivery:rc

      - name: Upload release candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-evidence
          path: |
            build/delivery-verdict.json
            .tmp/qa-evidence/**
            .tmp/release-evidence-packet/**
            .tmp/packaging-smoke/**
          if-no-files-found: ignore
