name: Release Candidate Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-gate:
    name: Build and verify immutable candidate artifacts
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release-candidate
    env:
      LENGRVIS_STRICT_STATE_MACHINE: "true"
      LENGRVIS_ALLOW_MOCK_FALLBACK: "false"
      LENGRVIS_RELEASE_CANDIDATE_COMMIT: ${{ github.sha }}
      LENGRVIS_RELEASE_BUILD_IDENTIFIER: rc-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      LENGRVIS_RELEASE_CANDIDATE_REPOSITORY: ${{ github.repository }}
      LENGRVIS_RELEASE_CANDIDATE_RUN_ID: ${{ github.run_id }}
      LENGRVIS_RELEASE_CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Verify checked-out candidate binding
        run: python scripts/verify_release_candidate_binding.py --require-checkout-match

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"

      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          npm --prefix desktop exec playwright install chromium

      - name: Validate full review scorecard
        run: npm run review:scorecard

      - name: Validate Agentic threat model
        run: npm run security:threat-model

      - name: Run release hygiene and dependency preflight
        id: hygiene
        run: npm run deps:verify

      - name: Run backend, desktop, and mobile quality preflight
        id: qa_gate
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
        run: npm run qa:gate

      - name: Run real-provider quality preflight
        id: real_llm_quality
        env:
          LENGRVIS_API_KEY: ${{ secrets.LENGRVIS_REAL_LLM_API_KEY }}
          LENGRVIS_PROVIDER_NAME: ${{ vars.LENGRVIS_REAL_LLM_PROVIDER_NAME || 'openai_compatible' }}
          LENGRVIS_BASE_URL: ${{ vars.LENGRVIS_REAL_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LENGRVIS_MODEL: ${{ vars.LENGRVIS_REAL_LLM_MODEL || 'gpt-4o-mini' }}
          LENGRVIS_ALLOW_MOCK_FALLBACK: "false"
        run: python scripts/run_real_llm_eval.py --quality-gate

      - name: Run supply-chain preflight
        id: supply_chain
        run: npm run supply-chain:verify && npm run audit:deps && npm run security:secrets

      - name: Run extension security preflight
        id: extension_security
        run: npm run security:extensions

      - name: Build release artifacts
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_RELEASE_EVIDENCE_HMAC_SECRET: ${{ secrets.LENGRVIS_RELEASE_EVIDENCE_HMAC_SECRET }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build_all.ps1 -SkipTests

      - name: Verify signed Windows release configuration
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: npm --prefix desktop run verify:signed-build-config

      - name: Sign backend executable
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161: ${{ vars.AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161 }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/sign_windows_backend.ps1 -AllowModuleInstall

      - name: Sign portable launcher
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161: ${{ vars.AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161 }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/sign_windows_portable_artifacts.ps1 -LauncherOnly

      - name: Refresh portable release bundle
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/refresh_portable_release_bundle.ps1

      - name: Sign self-extracting portable executable
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161: ${{ vars.AZURE_TRUSTED_SIGNING_TIMESTAMP_RFC3161 }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/sign_windows_portable_artifacts.ps1 -SelfExtractingOnly

      - name: Build signed Windows installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: npm --prefix desktop run dist:signed

      - name: Automated candidate delivery verdict
        # A failed prerequisite stops the job. These are step outcomes from
        # this candidate run, never a synthetic all-success declaration.
        env:
          LENGRVIS_AUDIT_HMAC_SECRET: ${{ format('{0}-{1}-{2}', 'ci', 'audit', 'hmac-secret') }}
          LENGRVIS_API_KEY: ${{ secrets.LENGRVIS_REAL_LLM_API_KEY }}
          LENGRVIS_PROVIDER_NAME: ${{ vars.LENGRVIS_REAL_LLM_PROVIDER_NAME || 'openai_compatible' }}
          LENGRVIS_BASE_URL: ${{ vars.LENGRVIS_REAL_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LENGRVIS_MODEL: ${{ vars.LENGRVIS_REAL_LLM_MODEL || 'gpt-4o-mini' }}
          LENGRVIS_MODE: efficiency
          AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_THUMBPRINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: npm run delivery:candidate

      - name: Upload release candidate artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-artifacts
          path: |
            build/delivery-candidate-verdict.json
            dist/backend.exe
            dist/backend-capabilities.json
            dist/Lengrvis-win-portable/**
            dist/Lengrvis-win-portable.zip
            dist/Lengrvis-*-x64-self-extracting.exe
            desktop/release/**
            .tmp/qa-evidence/**
            .tmp/release-evidence-packet/**
          if-no-files-found: error

      - name: Upload blocked release candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocked-release-candidate-diagnostics
          path: |
            build/delivery-verdict.json
            build/delivery-candidate-verdict.json
            docs/release/current-release-evidence.md
            .tmp/qa-evidence/**
            .tmp/release-evidence-packet/**
            .tmp/packaging-smoke/**
          if-no-files-found: ignore
