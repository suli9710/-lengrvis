# Scheduled dependency vulnerability scan (market-readiness checklist #16 SCA).
# Fail-closed: any high-severity finding or missing pip-audit fails the run.
name: Security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
      - name: Run gitleaks on tracked source
        shell: bash
        run: |
          set -euo pipefail
          empty_ignore="$RUNNER_TEMP/gitleaks-empty-ignore"
          : > "$empty_ignore"
          tracked_dir="$RUNNER_TEMP/lengrvis-gitleaks-tracked"
          rm -rf "$tracked_dir"
          mkdir -p "$tracked_dir"
          git archive --format=tar HEAD | tar -x -C "$tracked_dir"
          cd "$tracked_dir"
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --config .gitleaks-ci.toml --gitleaks-ignore-path "$empty_ignore" --redact --no-banner .
          cd "$GITHUB_WORKSPACE"
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --config .gitleaks-ci.toml --gitleaks-ignore-path "$empty_ignore" --redact --no-banner --log-opts="--all" .

  sca:
    name: npm audit + pip-audit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked audit dependencies
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Dependency audit (workspace + desktop + mobile npm audit, backend pip-audit)
        run: npm run audit:deps
