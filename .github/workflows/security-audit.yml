# Scheduled dependency vulnerability scan (market-readiness checklist #16 SCA).
# Fail-closed: any high-severity finding or missing pip-audit fails the run.
name: Security audit

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca:
    name: npm audit + pip-audit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Dependency audit (desktop + mobile npm audit, backend pip-audit)
        run: npm run audit:deps
