# Scheduled dependency vulnerability scan (market-readiness checklist #16 SCA).
# Fail-closed: any high-severity finding or missing pip-audit fails the run.
name: Security audit

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca:
    name: npm audit + pip-audit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Dependency audit (desktop + mobile npm audit, backend pip-audit)
        run: npm run audit:deps
