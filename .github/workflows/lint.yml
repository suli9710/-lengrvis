# Ruff lint gate (code-review checklist I-03).
# ruff is configured in backend/pyproject.toml and pinned in
# .pre-commit-config.yaml (v0.9.6). CI keeps changed backend Python files strict
# and also fails if full-tree Ruff debt grows beyond ci/ruff-baseline.json.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff lint + format gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install locked lint dependencies
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Ruff full-tree debt budget
        run: python scripts/check_ruff_baseline.py backend --baseline ci/ruff-baseline.json
      - name: Collect changed backend Python files
        id: ruff_targets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p .tmp

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "$BASE_REF"
            git diff --name-only --diff-filter=ACMRT "origin/$BASE_REF...HEAD" -- "backend/**/*.py" > .tmp/ruff-targets.txt
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only --diff-filter=ACMRT "$BEFORE_SHA" HEAD -- "backend/**/*.py" > .tmp/ruff-targets.txt
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only --diff-filter=ACMRT HEAD^ HEAD -- "backend/**/*.py" > .tmp/ruff-targets.txt
          else
            : > .tmp/ruff-targets.txt
          fi

          if [[ ! -s .tmp/ruff-targets.txt ]]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "No changed backend Python files."
            exit 0
          fi

          echo "has_targets=true" >> "$GITHUB_OUTPUT"
          sed 's/^/ - /' .tmp/ruff-targets.txt
      - name: Ruff lint (changed backend files)
        if: steps.ruff_targets.outputs.has_targets == 'true'
        shell: bash
        run: xargs -a .tmp/ruff-targets.txt python -m ruff check
      - name: Ruff format check (changed backend files)
        if: steps.ruff_targets.outputs.has_targets == 'true'
        shell: bash
        run: xargs -a .tmp/ruff-targets.txt python -m ruff format --check
