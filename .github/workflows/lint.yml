# Ruff lint gate (code-review checklist I-03).
# ruff is configured in backend/pyproject.toml and pinned in
# .pre-commit-config.yaml (v0.9.6), but it was never enforced in CI. This makes
# ruff a blocking, fail-closed gate, aligned with the pre-commit ruff version
# and the ^backend/ scope.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff lint + format gate (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ruff (pinned to the pre-commit version)
        run: python -m pip install "ruff==0.9.6"
      - name: Ruff lint (fail-closed)
        run: python -m ruff check backend
      - name: Ruff format check (fail-closed)
        run: python -m ruff format --check backend
