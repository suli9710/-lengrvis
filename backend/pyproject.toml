[project]
name = "lengrvis-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "PyJWT>=2.10",
  "cryptography>=42.0",
  "keyring>=25.0; platform_system != 'Windows'",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "psutil>=6.0",
  "send2trash>=1.8",
  "pypdf>=5.0",
  "Pillow>=10.0",
  "pytesseract>=0.3.10",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pandas>=2.2",
  "beautifulsoup4>=4.12",
  "playwright>=1.48",
  "croniter>=2.0",
  "numpy>=1.26",
  "watchdog>=4.0",
  "blake3>=0.4.1",
  "docling>=2.30",
  "unstructured[all-docs]>=0.16",
  "paddleocr>=2.8",
  "pywin32>=306; platform_system == 'Windows'",
  "comtypes>=1.4; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "pytest-xdist>=3.5",
  "pre-commit>=4.0",
]
acceleration = [
  "tokenizers>=0.20",
  "transformers>=4.45",
  "onnxruntime>=1.18",
]
winml = [
  "onnxruntime-windowsml>=1.22; platform_system == 'Windows'",
  "onnxruntime-genai-winml>=0.8; platform_system == 'Windows'",
]
directml = [
  "onnxruntime-directml>=1.18; platform_system == 'Windows'",
  "onnxruntime-genai-directml>=0.8; platform_system == 'Windows'",
]
openvino = [
  "onnxruntime-openvino>=1.18",
  "openvino>=2024.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: tests that are intentionally slower or rely on subprocess/thread timeout behavior or full local diagnostic/evaluation flows; exclude with -m 'not slow' in short runner budgets and run explicitly for full sign-off.",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S404", "S603", "S607"]
