[project]
name = "lengrvis-agent-backend"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139.0,<1.0",
  "uvicorn[standard]>=0.50.2,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.10,<3.0",
  "cryptography>=49.0.0,<50.0",
  "keyring>=25.0,<27.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "psutil>=6.0,<8.0",
  "send2trash>=1.8,<3.0",
  "pypdf>=6.14.2,<7.0",
  "Pillow>=12.3.0,<13.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-pptx>=1.0,<2.0",
  "pandas>=3.0.3,<4.0",
  "beautifulsoup4>=4.12,<5.0",
  "playwright>=1.61.0,<2.0",
  "croniter>=6.2.3,<7.0",
  "numpy>=1.26,<3.0",
  "watchdog>=4.0,<7.0",
  "blake3>=1.0.9,<2.0",
  "pywin32>=306,<400; platform_system == 'Windows'",
  "comtypes>=1.4,<2.0; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.15.20,<1.0",
  "pytest-xdist>=3.8.0,<4.0",
  "pre-commit>=4.6.0,<5.0",
]
document-ai = [
  "docling>=2.110.0,<3.0",
  "unstructured[all-docs]>=0.24.0,<1.0",
]
ocr = [
  "pytesseract>=0.3.13,<0.4",
  "paddleocr>=3.7.0,<4.0",
]
acceleration = [
  "tokenizers>=0.23.1,<1.0",
  "transformers>=5.13.0,<6.0",
  "onnxruntime>=1.27.0,<2.0",
  "onnxruntime-genai>=0.14.1,<1.0",
]
winml = [
  "onnxruntime-windowsml>=1.27.0.202606181907,<2.0; platform_system == 'Windows'",
  "onnxruntime-genai-winml>=0.14.1,<1.0; platform_system == 'Windows'",
]
directml = [
  "onnxruntime-directml>=1.24.4,<2.0; platform_system == 'Windows'",
  "onnxruntime-genai-directml>=0.14.1,<1.0; platform_system == 'Windows'",
]
openvino = [
  "onnxruntime-openvino>=1.24.1,<2.0",
  "openvino>=2026.2.1,<2027.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -W ignore::starlette.exceptions.StarletteDeprecationWarning"
markers = [
  "slow: tests that are intentionally slower or rely on subprocess/thread timeout behavior or full local diagnostic/evaluation flows; exclude with -m 'not slow' in short runner budgets and run explicitly for full sign-off.",
  "desktop_api_token_optional: opt-in bypass for desktop API token guard in TestClient tests.",
  "requires_desktop_api_token: enforce desktop API token guard; excludes desktop_api_token_optional marker.",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes_guardian.py" = ["B008"]
"app/api/routes_mobile.py" = ["B008"]
"app/api/routes_settings.py" = ["B008"]
"tests/**" = ["E501", "S101", "S105", "S404", "S603", "S607"]
