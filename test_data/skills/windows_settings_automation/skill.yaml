name: windows-settings-automation
version: "1.0.0"
agent_owner: AppAgent
risk:
  default: R3_DESTRUCTIVE_OR_SYSTEM
permissions:
  - system.read
tools:
  - name: skill.windows_settings.preview
    description: Preview Windows settings automation for theme, resolution, night light, and lock screen ads.
    risk: R0_READ_ONLY
    permissions:
      - system.read
    supports_dry_run: true
    input_schema:
      type: object
      properties:
        action:
          type: string
          enum:
            - query
            - set_theme
            - set_resolution
            - set_night_light
            - set_lock_screen_ads
        theme:
          type: string
          enum:
            - light
            - dark
        width:
          type: integer
        height:
          type: integer
        enabled:
          type: boolean
        dry_run:
          type: boolean
      required:
        - action
    output_schema:
      type: object
      properties:
        ok:
          type: boolean
        dry_run:
          type: boolean
        operations:
          type: array
    execution:
      type: python
      entry: handlers/settings.py
      timeout_seconds: 10
    smoke_tests:
      - name: settings-preview-query
        args:
          action: query
          dry_run: true
        expected:
          ok: true
    rollback_hint: Read-only settings preview does not apply system changes.
  - name: skill.windows_settings.apply
    description: Apply supported Windows settings through PowerShell or registry-backed commands after approval.
    risk: R3_DESTRUCTIVE_OR_SYSTEM
    permissions:
      - system.set
    supports_dry_run: true
    input_schema:
      type: object
      properties:
        action:
          type: string
          enum:
            - set_theme
            - set_resolution
            - set_night_light
            - set_lock_screen_ads
        theme:
          type: string
          enum:
            - light
            - dark
        width:
          type: integer
        height:
          type: integer
        enabled:
          type: boolean
        dry_run:
          type: boolean
      required:
        - action
    output_schema:
      type: object
      properties:
        ok:
          type: boolean
        dry_run:
          type: boolean
        applied:
          type: boolean
        operations:
          type: array
    execution:
      type: python
      entry: handlers/settings.py
      timeout_seconds: 20
    smoke_tests:
      - name: settings-apply-preview
        args:
          action: set_theme
          theme: dark
          dry_run: true
        expected:
          ok: true
          dry_run: true
    rollback_hint: Capture the previous setting value before approval and restore it through the same action if rollback is requested.
