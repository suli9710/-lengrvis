name: demo-echo
version: "1.0.0"
agent_owner: FileAgent
risk:
  default: R0_READ_ONLY
permissions:
  - skill.echo.read
tools:
  - name: skill.demo.echo
    description: Echo text through the demo Python skill handler.
    risk: R0_READ_ONLY
    permissions:
      - skill.echo.read
    input_schema:
      type: object
      properties:
        text:
          type: string
      required:
        - text
    output_schema:
      type: object
      properties:
        ok:
          type: boolean
        echo:
          type: string
    execution:
      type: python
      entry: handlers/echo.py
      timeout_seconds: 5
    smoke_tests:
      - name: echo-smoke
        args:
          text: hello
        expected:
          ok: true
          echo: hello
    rollback_hint: Read-only echo has no persistent side effects.
