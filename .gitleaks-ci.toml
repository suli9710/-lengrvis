# Strict CI configuration for tracked source files.
# Keep this separate from .gitleaks.toml, which excludes local build/runtime
# folders for developer convenience. CI scans a git archive, so broad path
# allowlists would hide accidentally tracked secrets.

[extend]
useDefault = true

# --- Custom rules ---

[[rules]]
id = "android-keystore"
description = "Android/Java signing keystore file"
path = '''(?i)\.(keystore|jks|p12|pfx)$'''
tags = ["keystore", "android"]

[[rules]]
id = "lengrvis-audit-secret"
description = "Lengrvis HMAC audit secret"
regex = '''(?i)\bLENGRVIS_AUDIT_HMAC_SECRET\b\s*(?:=|:)\s*["']?([^"'\s#]{8,})["']?'''
secretGroup = 1
tags = ["lengrvis", "secret"]

[[rules]]
id = "lengrvis-keystore-env"
description = "Lengrvis Android keystore env var with value"
regex = '''(?i)\bLENGRVIS_ANDROID_KEYSTORE_(?:FILE|PASSWORD|ALIAS|KEY_PASSWORD)\b\s*(?:=|:)\s*["']?([^"'\s#]{8,})["']?'''
secretGroup = 1
tags = ["lengrvis", "android", "secret"]

# --- Allowlist ---

[[allowlists]]
description = "Allowed source-level test fixtures only"
condition = "AND"
regexTarget = "match"
paths = [
  '''^backend/tests/''',
  '''^desktop/scripts/.*smoke.*\.cjs$''',
  '''^test_data/''',
]
regexes = [
  '''__LENGRVIS_ALLOWED_TEST_SECRET_FIXTURE__''',
]

[[allowlists]]
description = "Historical test-only TLS fixture private key before runtime generation"
condition = "AND"
regexTarget = "match"
commits = [
  "770d0fca61c2b09b8c3f9e4fc90140be1d9e3b87",
  "2e9a37efaf9f995097455e032e4b752ad2311fee",
]
paths = ['''^backend/tests/tls_test_material\.py$''']
regexes = ['''-----BEGIN RSA PRIVATE KEY-----''']

[[allowlists]]
description = "Historical task-result redaction fixture"
condition = "AND"
regexTarget = "match"
commits = [
  "19671fb2c05d65d9ea1628e4afe2e1ec72af57ad",
]
paths = ['''^desktop/src/renderer/features/task-results/taskResultTimeline\.test\.ts$''']
# Keep the historical token split with a character class so this allowlist
# declaration is not itself mistaken for a current generic API-key finding.
regexes = ['''token=abc123[4]56789''']

