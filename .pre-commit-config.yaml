repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: gitleaks-strict
        name: gitleaks strict source scan
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/secret_scan.ps1 -Staged
        language: system
        pass_filenames: false
