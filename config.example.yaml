llm:
  provider_name: openai_compatible
  base_url: https://api.openai.com/v1
  api_key: ""
  model: gpt-4o-mini
  model_context_window: 128000
  model_auto_compact_token_limit: 96000
  # Privacy mode automatically prefers an ONNX GenAI model bundle when present.
  # Set onnx_model_path or LENGRVIS_ONNX_MODEL_PATH to a Qwen2.5-3B ONNX GenAI directory/config,
  # or place the bundle under ./.lengrvis_data/models. onnx_execution_provider may be WinML,
  # DirectML, OpenVINO, CPU, or blank for automatic preference.
  onnx_model_path: ""
  onnx_runtime: auto
  onnx_execution_provider: ""
  onnx_provider_preference: winml,directml,openvino,cpu
  onnx_directml_device_id: ""
  onnx_openvino_device: AUTO
  onnx_openvino_cache_dir: ""
  onnx_warm_on_startup: false
  onnx_model_family: ""
  embedding_backend: auto
  onnx_embedding_model_path: ""
  onnx_embedding_execution_provider: ""
  onnx_embedding_model_id: intfloat/multilingual-e5-small
  onnx_embedding_max_batch_size: 32
  image_embedding_backend: auto
  onnx_image_embedding_model_path: ""
  onnx_image_embedding_execution_provider: ""
  onnx_image_embedding_model_id: openai/clip-vit-base-patch32
  onnx_image_embedding_max_batch_size: 8
  ocr_backend: auto
  ocr_execution_provider: ""
  ocr_openvino_model_dir: ""
  ocr_openvino_device: AUTO
  ocr_lang: multi
  ocr_min_confidence: 0.0
  ocr_batch_size: 1
  embedding_model: text-embedding-3-small
  temperature: 0.2
  max_tokens: 1600
  timeout: 30
  llm_api_max_retries: 2
  llm_api_retry_backoff_seconds: 0.25
  llm_api_circuit_failure_threshold: 5
  llm_api_circuit_cooldown_seconds: 30.0

paths:
  data_dir: ./.lengrvis_data
  skill_directories:
    - ./.lengrvis_data/skills
  allowed_directories:
    - ./test_data/files/workspace
  app_allowlist:
    - notepad
    - calculator
    - calc

transport:
  # Enables HTTPS for LAN/mobile pairing when start_app.ps1 is launched with matching cert/key files.
  # Lengrvis does not install or trust root certificates automatically.
  lan_tls_enabled: false
  lan_tls_cert_file: ""
  lan_tls_key_file: ""
  # Optional advertised origin for phones, for example https://192.168.1.20:8000.
  # Leave blank to let diagnostics/pairing suggest a LAN IP and current backend port.
  lan_public_base_url: ""

privacy:
  mode: efficiency
  allow_cloud_context: false
  allow_file_content_upload: false
  allow_browser_network: false
  # Local Python/Shell skill handlers run as normal subprocesses, not an OS sandbox.
  # Enable only for trusted development skill packages.
  allow_unsafe_local_skill_execution: false
  strict_state_machine: false
  # Leave blank to persist a generated secret in paths.data_dir/mobile_jwt.secret.
  # LENGRVIS_JWT_SECRET or a non-empty jwt_secret value overrides that local file.
  jwt_secret: ""
  browser_max_page_bytes: 250000
  document_max_chars_to_llm: 30000
  browser_screenshot_dir: ""

perception:
  enabled: false
  interval_seconds: 5.0
  publish_events: true
  max_width: 1280
  max_height: 720
  jpeg_quality: 70
  frame_diff_gate_enabled: true
  frame_diff_threshold: 0.001
  local_ocr_enabled: false
  storage_enabled: true
  # V1 stores summaries only. ScreenState.image_base64, OCR full text, and full UI trees
  # are stripped before persistence even if upstream producers include them.
  store_screenshots: false
  app_context_interval_seconds: 2.0
  environment_store_screenshots: false
  environment_event_retention_days: 7
  environment_sensitive_window_terms:
    - password
    - token
    - cookie
    - otp
    - card
    - bank
    - checkout
    - 2fa
  sensitive_window_patterns:
    - password
    - passcode
    - 1password
    - bitwarden
    - lastpass
    - keychain
    - credential
    - secret
    - token
    - cookie
    - otp
    - 2fa
    - api key
    - bank
    - card
    - payment
    - checkout
    - wallet
  sensitive_field_names:
    - password
    - passcode
    - pin
    - secret
    - token
    - api_key
    - authorization
    - cookie
    - credential
    - credit_card
    - card_number
    - cvv
    - ssn

orchestration:
  recovery_max_retries: 3
  execution_engines: dual
  default_engine: auto
  agent_loop_max_turns: 30
  run_event_retention_days: 30
  context_auto_compact_enabled: true
  context_micro_compact_enabled: true
  context_history_snip_enabled: true
  context_session_memory_enabled: true
  context_warning_buffer_tokens: 20000
  context_error_buffer_tokens: 20000
  context_manual_compact_buffer_tokens: 3000
  context_recent_message_limit: 24
  context_micro_compact_age: 8
  context_micro_compact_tool_result_chars: 1200
  context_history_snip_threshold: 160
  context_history_snip_keep_recent: 80
  context_session_summary_limit: 12000
