appId: com.lengrvis.desktop
productName: Lengrvis
copyright: Copyright (c) 2026 Lengrvis

directories:
  output: release

files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json

asar: true

# Electron Fuses：关闭危险的运行时入口（默认全开）。
# runAsNode / NODE_OPTIONS / --inspect 否则允许本地恶意进程把已安装应用
# 当作通用 Node.js 运行；同时启用 cookie 加密与 asar 完整性校验。
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

extraMetadata:
  main: dist/main/main.js

# 自动更新发布通道（electron-updater）。
# 该配置会把 app-update.yml 打进安装包，electron-updater 据此查询 GitHub Releases。
# 真正发布需要 GH_TOKEN 环境变量并运行 `npm run dist:publish`；
# 本地 `npm run dist` 仍然只构建、不发布（electron-builder 默认 --publish onTagOrDraft 之外为 never）。
publish:
  provider: github
  owner: suli9710
  repo: "-lengrvis"
  releaseType: release

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 代码签名（按持有凭证类型二选一，均通过环境变量注入，本文件无需为无签名的本地构建改动）：
  # 1) OV/EV PFX 证书：设置 WIN_CSC_LINK（pfx 路径或 base64）与 WIN_CSC_KEY_PASSWORD，
  #    electron-builder 会自动签名所有 exe/dll；未设置时跳过签名（SmartScreen 会拦截，仅限内部分发）。
  # 2) Azure Trusted Signing：使用 electron-builder.signed.yml（azureSignOptions），
  #    需要 AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET 凭证。
  # 注意：随包分发的 backend.exe 属于 extraResources，electron-builder 不会自动签它，
  #   发布前需在 CI 中先对 dist/backend.exe 单独 signtool 签名再打包。
  #   dist:signed / dist:publish 会通过 scripts/verify-backend-signature.cjs
  #   强制校验 backend 二进制的 Authenticode/codesign 签名，未签名直接失败。
  # 签名上线后启用更新包签名校验；未签名本地 dist 构建请使用 electron-builder.signed.yml。
  verifyUpdateCodeSignature: true
  extraResources:
    - from: ../dist/backend.exe
      to: backend/backend.exe
    - from: ../dist/backend-capabilities.json
      to: backend/backend-capabilities.json

mac:
  target:
    - dmg
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  extraResources:
    - from: ../dist/backend
      to: backend/backend
    - from: ../dist/backend-capabilities.json
      to: backend/backend-capabilities.json

linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
  extraResources:
    - from: ../dist/backend
      to: backend/backend
    - from: ../dist/backend-capabilities.json
      to: backend/backend-capabilities.json
